server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<link rel="stylesheet" href="/responsive.css?v=4"><link rel="stylesheet" href="/premium.css?v=1"><link rel="stylesheet" href="/premium-v2.css?v=1"><script defer src="/responsive.js?v=4"></script><script defer src="/product-edit-integration.js?v=4"></script><script defer src="/premium-ui.js?v=1"></script><script defer src="/premium-v2.js?v=1"></script></head>';
    }
}
