<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transferências • Adega ERP</title><style>
:root{--bg:#0d0f12;--panel:#15181d;--line:#2b3139;--text:#f4f6f8;--muted:#9ba6b2;--gold:#d8a23b;--green:#35c47c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui}.shell{max-width:1300px;margin:auto;padding:28px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.field{width:100%;margin:8px 0;background:#0f1216;border:1px solid var(--line);color:white;border-radius:9px;padding:11px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--gold);font-weight:800;cursor:pointer;text-decoration:none;color:#17120a}.secondary{background:#252b33;color:white}.muted{color:var(--muted)}.message{padding:12px;border-radius:9px;margin:12px 0;background:#18271f;color:#79e1a6}.message.error{background:#321c20;color:#ff9a9a}.product{display:grid;grid-template-columns:1fr 100px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.product input{margin:0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}@media(max-width:850px){.two{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.shell{padding:16px}table{display:block;overflow:auto}}
</style></head><body><main class="shell"><header class="top"><div><h1>Transferência entre lojas</h1><div id="identity" class="muted">Carregando...</div></div><a class="btn secondary" href="/">Voltar ao PDV</a></header><div id="message"></div><section class="two"><article class="card"><h2>Produtos da origem</h2><input id="search" class="field" placeholder="Buscar produto ou código"><div id="products"></div></article><article class="card"><h2>Destino</h2><select id="destination" class="field"></select><textarea id="notes" class="field" placeholder="Observação"></textarea><div class="row"><span>Unidades selecionadas</span><b id="total">0</b></div><button id="transfer" class="btn field">Concluir transferência</button></article></section><section class="card" style="margin-top:14px"><h2>Histórico da loja</h2><table><thead><tr><th>ID</th><th>Origem</th><th>Destino</th><th>Usuário</th><th>Data</th></tr></thead><tbody id="history"></tbody></table></section></main><script>
const API=`http://${location.hostname}:8000`,token=localStorage.getItem('at_token');const $=id=>document.getElementById(id),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me,products=[],stores=[];function logout(){localStorage.removeItem('at_token');location.href='/'}async function request(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};if(opt.body)opt.headers['Content-Type']='application/json';const r=await fetch(API+path,opt);let d={};try{d=await r.json()}catch{}if(r.status===401){logout();throw Error('Sessão expirada')}if(!r.ok)throw Error(d.detail||'Erro na API');return d}function notify(text,error=false){$('message').innerHTML=`<div class="message ${error?'error':''}">${safe(text)}</div>`}function storeName(id){return stores.find(s=>s.id===id)?.name||id}
function renderProducts(query=''){query=query.toLowerCase();$('products').innerHTML=products.filter(p=>p.stock>0&&(p.name.toLowerCase().includes(query)||(p.barcode||'').includes(query))).map(p=>`<div class="product"><div><b>${safe(p.name)}</b><div class="muted">${p.stock} un. disponíveis</div></div><input class="field qty" data-id="${p.id}" type="number" min="0" max="${p.stock}" value="0"></div>`).join('')||'<p class="muted">Nenhum produto disponível.</p>';document.querySelectorAll('.qty').forEach(e=>e.oninput=updateTotal);updateTotal()}function updateTotal(){$('total').textContent=[...document.querySelectorAll('.qty')].reduce((n,e)=>n+(+e.value||0),0)}
async function load(){if(!token)return logout();me=await request('/auth/me');const current=me.context.selected_store_id;[products,stores]=await Promise.all([request('/products'),request('/stock/transfer-destinations')]);const history=await request('/stock/transfers');const active=me.context.stores.find(s=>s.id===current);stores=[...(active?[active]:[]),...stores];$('identity').textContent=`${me.context.company.name} • Origem: ${active?.name||''}`;$('destination').innerHTML=stores.filter(s=>s.id!==current&&s.active!==false).map(s=>`<option value="${s.id}">${safe(s.name)} • ${safe(s.code)}</option>`).join('');$('history').innerHTML=history.map(t=>`<tr><td>#${t.id}</td><td>${safe(storeName(t.source_store_id))}</td><td>${safe(storeName(t.destination_store_id))}</td><td>${safe(t.user)}</td><td>${new Date(t.created_at).toLocaleString('pt-BR')}</td></tr>`).join('');renderProducts()}
$('search').oninput=e=>renderProducts(e.target.value);$('transfer').onclick=async()=>{try{const items=[...document.querySelectorAll('.qty')].map(e=>({product_id:+e.dataset.id,quantity:+e.value||0})).filter(x=>x.quantity>0);if(!items.length)throw Error('Selecione ao menos um produto');if(!$('destination').value)throw Error('Cadastre outra loja para realizar a transferência');await request('/stock/transfers',{method:'POST',body:JSON.stringify({destination_store_id:+$('destination').value,notes:$('notes').value||null,items})});notify('Transferência concluída.');await load()}catch(e){notify(e.message,true)}};load().catch(e=>notify(e.message,true));
</script></body></html>
