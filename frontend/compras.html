<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adega Torres • Compras</title><style>:root{--bg:#0d0f12;--panel:#15181d;--line:#2b3139;--text:#f4f6f8;--muted:#9ba6b2;--gold:#d8a23b;--green:#35c47c;--red:#ff6262}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text)}main{max-width:1400px;margin:auto;padding:28px}.top,.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{width:100%;background:#0f1216;border:1px solid var(--line);color:white;border-radius:9px;padding:11px}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:var(--gold);font-weight:800}.secondary{background:#242a32;color:white}.danger{background:#3a2023;color:#ff8b8b}.muted{color:var(--muted)}.green{color:var(--green)}.red{color:var(--red)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.item{display:grid;grid-template-columns:2fr .6fr .8fr auto;gap:8px;margin:8px 0}.total{font-size:25px;font-weight:900}.notice{padding:12px;margin-top:10px;background:#18221d;color:#7de2aa;border-radius:9px}@media(max-width:850px){.grid,.fields{grid-template-columns:1fr}.item{grid-template-columns:1fr 1fr}.item select{grid-column:1/-1}}</style></head><body><main><div class="top"><div><h1 style="margin:0">Compras & Fornecedores</h1><div class="muted">Adega Torres • entradas comerciais e custo médio</div></div><a class="btn secondary" href="/">← Voltar ao PDV</a></div><div id="authError" class="red"></div><div class="grid"><section class="card"><div class="row"><h2>Fornecedores</h2><span id="supplierCount" class="muted"></span></div><div class="fields"><input id="sName" class="field" placeholder="Razão social / nome"><input id="sDoc" class="field" placeholder="CNPJ / CPF"><input id="sPhone" class="field" placeholder="Telefone"><input id="sEmail" class="field" placeholder="E-mail"><input id="sNotes" class="field" placeholder="Observações"><button id="saveSupplier" class="btn">Cadastrar fornecedor</button></div><div id="supplierNotice"></div><div style="overflow:auto"><table><thead><tr><th>Fornecedor</th><th>Documento</th><th>Contato</th></tr></thead><tbody id="supplierTable"></tbody></table></div></section><section class="card"><h2>Nova compra / entrada</h2><div class="fields"><select id="purchaseSupplier" class="field"></select><input id="purchaseDoc" class="field" placeholder="NF / pedido / referência"><button id="addItem" class="btn secondary">+ Adicionar item</button></div><div id="items"></div><div class="row"><span class="muted">O custo informado recalcula o CMP de cada produto.</span><span class="total" id="purchaseTotal">R$ 0,00</span></div><button id="savePurchase" class="btn">Confirmar compra e dar entrada</button><div id="purchaseNotice"></div></section></div><section class="card"><div class="row"><h2>Histórico de compras</h2><button id="reload" class="btn secondary">Atualizar</button></div><div style="overflow:auto"><table><thead><tr><th>#</th><th>Data</th><th>Fornecedor</th><th>Documento</th><th>Total</th></tr></thead><tbody id="purchaseTable"></tbody></table></div></section></main><script>const API=`http://${location.hostname}:8000`,token=localStorage.getItem('at_token'),$=id=>document.getElementById(id),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let suppliers=[],products=[],purchases=[];async function req(path,opt={}){if(!token)throw Error('Faça login no PDV antes de acessar Compras.');opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};if(opt.body)opt.headers['Content-Type']='application/json';const r=await fetch(API+path,opt);let d={};try{d=await r.json()}catch{}if(r.status===401)throw Error('Sessão expirada. Volte ao PDV e faça login.');if(!r.ok)throw Error(d.detail||'Erro na API');return d}async function load(){try{[suppliers,products,purchases]=await Promise.all([req('/suppliers'),req('/products'),req('/purchases')]);render()}catch(e){$('authError').textContent=e.message}}function render(){$('supplierCount').textContent=suppliers.length+' cadastrados';$('supplierTable').innerHTML=suppliers.map(s=>`<tr><td><b>${safe(s.name)}</b></td><td>${safe(s.document||'—')}</td><td>${safe(s.phone||s.email||'—')}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Nenhum fornecedor.</td></tr>';$('purchaseSupplier').innerHTML='<option value="">Selecione o fornecedor</option>'+suppliers.map(s=>`<option value="${s.id}">${safe(s.name)}</option>`).join('');$('purchaseTable').innerHTML=purchases.map(p=>`<tr><td>${p.id}</td><td>${new Date(p.created_at).toLocaleString('pt-BR')}</td><td>${safe(p.supplier)}</td><td>${safe(p.document||'—')}</td><td><b>${money(p.total)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nenhuma compra registrada.</td></tr>';if(!$('items').children.length)addItem()}function addItem(){let d=document.createElement('div');d.className='item';d.innerHTML=`<select class="field product"><option value="">Produto</option>${products.map(p=>`<option value="${p.id}">${safe(p.name)} • estoque ${p.stock} • CMP ${money(p.cost)}</option>`).join('')}</select><input class="field qty" type="number" min="1" value="1" placeholder="Qtd"><input class="field cost" type="number" min="0.01" step=".01" placeholder="Custo unit."><button class="btn danger remove">×</button>`;$('items').appendChild(d);d.querySelector('.remove').onclick=()=>{d.remove();calc()};d.querySelectorAll('input').forEach(x=>x.oninput=calc);calc()}function calc(){let t=0;document.querySelectorAll('.item').forEach(i=>t+=(Number(i.querySelector('.qty').value)||0)*(Number(i.querySelector('.cost').value)||0));$('purchaseTotal').textContent=money(t)}$('saveSupplier').onclick=async()=>{try{let data={name:$('sName').value.trim(),document:$('sDoc').value.trim()||null,phone:$('sPhone').value.trim()||null,email:$('sEmail').value.trim()||null,notes:$('sNotes').value.trim()||null};await req('/suppliers',{method:'POST',body:JSON.stringify(data)});$('supplierNotice').innerHTML='<div class="notice">Fornecedor cadastrado.</div>';['sName','sDoc','sPhone','sEmail','sNotes'].forEach(x=>$(x).value='');await load()}catch(e){$('supplierNotice').innerHTML='<div class="red">'+safe(e.message)+'</div>'}};$('addItem').onclick=addItem;$('savePurchase').onclick=async()=>{try{let items=[...document.querySelectorAll('.item')].map(i=>({product_id:Number(i.querySelector('.product').value),quantity:Number(i.querySelector('.qty').value),unit_cost:Number(i.querySelector('.cost').value)}));if(!$('purchaseSupplier').value)throw Error('Selecione o fornecedor.');if(!items.length||items.some(i=>!i.product_id||i.quantity<=0||i.unit_cost<=0))throw Error('Preencha produto, quantidade e custo de todos os itens.');let r=await req('/purchases',{method:'POST',body:JSON.stringify({supplier_id:Number($('purchaseSupplier').value),document:$('purchaseDoc').value.trim()||null,items})});$('purchaseNotice').innerHTML=`<div class="notice">Compra #${r.id} registrada. Entrada de estoque concluída. Total ${money(r.total)}.</div>`;$('purchaseDoc').value='';$('items').innerHTML='';await load()}catch(e){$('purchaseNotice').innerHTML='<div class="red">'+safe(e.message)+'</div>'}};$('reload').onclick=load;load();</script></body></html>
