<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adega Torres V2</title>
<style>
body{margin:0;font-family:system-ui;background:#0d0f12;color:#f5f5f5}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#171a1f;border:1px solid #30353d;border-radius:14px;padding:20px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,button{padding:11px;border-radius:9px;border:1px solid #343a43;background:#101216;color:white}button{background:#d8a23b;color:#17120a;font-weight:800;cursor:pointer}.hidden{display:none}.kpi{flex:1;min-width:180px}.kpi b{font-size:26px;display:block;margin-top:7px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #30353d;text-align:left}.muted{color:#9ba6b2}.error{color:#ff7b7b}
</style></head><body><div class="wrap">
<h1>ADEGA <span style="color:#d8a23b">TORRES</span> <small class="muted">V2</small></h1>
<div id="loginBox" class="card"><h2>Entrar</h2><div class="row"><input id="usernameInput" placeholder="Usuário" value="admin"><input id="passwordInput" type="password" placeholder="Senha"><button id="loginButton">Entrar</button></div><p id="loginError" class="error"></p></div>
<div id="appBox" class="hidden">
<div class="row"><div class="card kpi">Produtos<b id="products">0</b></div><div class="card kpi">Unidades<b id="units">0</b></div><div class="card kpi">Estoque baixo<b id="low">0</b></div><div class="card kpi">Vendas acumuladas<b id="sales">R$ 0</b></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><h2>Produtos</h2><button id="refreshButton">Atualizar</button></div><table><thead><tr><th>Produto</th><th>Categoria</th><th>Estoque</th><th>Custo</th><th>Venda</th></tr></thead><tbody id="tbody"></tbody></table></div>
<p class="muted">Backend real: FastAPI + PostgreSQL + JWT.</p>
</div></div>
<script>
const API=`http://${location.hostname}:8000`;
let token=localStorage.getItem("at_token");
const loginBox=document.getElementById("loginBox"), appBox=document.getElementById("appBox"), usernameInput=document.getElementById("usernameInput"), passwordInput=document.getElementById("passwordInput"), loginError=document.getElementById("loginError");
const brl=n=>Number(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
async function doLogin(){
  loginError.textContent="";
  try{
    const r=await fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:usernameInput.value,password:passwordInput.value})});
    if(!r.ok){loginError.textContent="Usuário ou senha inválidos";return;}
    const d=await r.json(); token=d.access_token; localStorage.setItem("at_token",token); await showApp();
  }catch(e){loginError.textContent="Não foi possível conectar à API.";}
}
async function api(path){const r=await fetch(API+path,{headers:{Authorization:"Bearer "+token}});if(r.status===401){localStorage.removeItem("at_token");token=null;showLogin();throw new Error("Sessão expirada");}if(!r.ok)throw new Error("Erro na API");return r.json();}
async function load(){const d=await api("/dashboard");document.getElementById("products").textContent=d.products;document.getElementById("units").textContent=d.stock_units;document.getElementById("low").textContent=d.low_stock;document.getElementById("sales").textContent=brl(d.sales_total);const ps=await api("/products");document.getElementById("tbody").innerHTML=ps.map(p=>`<tr><td>${p.name}</td><td>${p.category}</td><td>${p.stock}</td><td>${brl(p.cost)}</td><td>${brl(p.price)}</td></tr>`).join("");}
function showLogin(){loginBox.classList.remove("hidden");appBox.classList.add("hidden");}
async function showApp(){loginBox.classList.add("hidden");appBox.classList.remove("hidden");try{await load();}catch(e){if(token)loginError.textContent="Erro ao carregar os dados.";}}
document.getElementById("loginButton").addEventListener("click",doLogin);document.getElementById("refreshButton").addEventListener("click",load);passwordInput.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
if(token)showApp(); else showLogin();
</script></body></html>
