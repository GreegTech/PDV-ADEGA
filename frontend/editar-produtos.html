<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adega Torres • Editar produtos</title><style>:root{--bg:#0d0f12;--panel:#15181d;--line:#2b3139;--text:#f4f6f8;--muted:#9ba6b2;--gold:#d8a23b;--green:#35c47c;--red:#ff8585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial}.wrap{max-width:1250px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}h1{margin:0}.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.toolbar{display:flex;gap:10px;margin-bottom:15px}.field{width:100%;background:#0f1216;border:1px solid var(--line);color:white;border-radius:9px;padding:11px 12px}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:var(--gold);color:#17120a;font-weight:800;text-decoration:none}.btn.secondary{background:#242a32;color:white}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px}.modal.show{display:grid}.box{width:min(850px,96vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.notice{margin-top:12px}.green{color:var(--green)}.red{color:var(--red)}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>Produtos & Estoque</h1><div class="muted">Edição manual segura • custo médio e estoque protegidos</div></div><a class="btn secondary" href="/">← Voltar ao PDV</a></div><div class="card"><div class="toolbar"><input class="field" id="search" placeholder="Buscar por produto ou código de barras..."></div><div style="overflow:auto"><table><thead><tr><th>Produto</th><th>Estoque</th><th>Custo médio</th><th>Preço tabela</th><th>Margem</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div><div class="modal" id="modal"><div class="box"><div class="top"><div><h2 style="margin:0">Editar produto</h2><div class="muted">Custo médio e estoque são somente leitura.</div></div><button class="btn secondary" id="close">Fechar</button></div><div class="grid"><input class="field" id="name" placeholder="Nome"><input class="field" id="barcode" placeholder="EAN/GTIN"><input class="field" id="brand" placeholder="Marca"><input class="field" id="category" placeholder="Categoria"><input class="field" id="content" placeholder="Conteúdo"><select class="field" id="unit"><option>UN</option><option>CX</option><option>KG</option><option>L</option></select><input class="field" id="min" type="number" min="0" placeholder="Estoque mínimo"><input class="field" id="cost" disabled title="Alterado somente por compras/NF-e"><input class="field" id="stock" disabled title="Alterado somente por movimentações"><input class="field" id="price" type="number" min="0" step="0.01" placeholder="Preço de venda"></div><div id="notice" class="notice"></div><br><button class="btn" id="save">Salvar alterações</button></div></div><script>const API=`http://${location.hostname}:8000`,token=localStorage.getItem('at_token');let products=[],editing=null;const $=id=>document.getElementById(id),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});if(!token)location.href='/';async function req(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};if(opt.body)opt.headers['Content-Type']='application/json';let r=await fetch(API+path,opt),d={};try{d=await r.json()}catch{}if(r.status===401){localStorage.removeItem('at_token');location.href='/'}if(!r.ok)throw Error(d.detail||'Erro na API');return d}function render(){let q=$('search').value.toLowerCase();$('rows').innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)||(p.barcode||'').includes(q)).map(p=>`<tr><td><b>${safe(p.name)}</b><br><small class="muted">${safe(p.barcode||'')}</small></td><td>${p.stock}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${p.price?(((p.price-p.cost)/p.price)*100).toFixed(1):'0.0'}%</td><td><button class="btn secondary edit" data-id="${p.id}">Editar</button></td></tr>`).join('');document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openEdit(Number(b.dataset.id)))}function openEdit(id){editing=products.find(p=>p.id===id);$('name').value=editing.name||'';$('barcode').value=editing.barcode||'';$('brand').value=editing.brand||'';$('category').value=editing.category||'';$('content').value=editing.package_content||'';$('unit').value=editing.unit||'UN';$('min').value=editing.min_stock??0;$('cost').value='Custo médio: '+money(editing.cost);$('stock').value='Estoque: '+editing.stock;$('price').value=Number(editing.price||0).toFixed(2);$('notice').textContent='';$('modal').classList.add('show')}async function save(){try{$('notice').className='notice muted';$('notice').textContent='Salvando...';let body={name:$('name').value.trim(),barcode:$('barcode').value.trim()||null,brand:$('brand').value.trim()||null,category:$('category').value.trim()||'Outros',package_content:$('content').value.trim()||null,unit:$('unit').value,min_stock:Number($('min').value||0),price:Number($('price').value||0)};let p=await req('/products/'+editing.id,{method:'PATCH',body:JSON.stringify(body)});products=products.map(x=>x.id===p.id?p:x);render();$('notice').className='notice green';$('notice').textContent='Produto atualizado. Vendas antigas mantêm preço e CMV congelados.'}catch(e){$('notice').className='notice red';$('notice').textContent=e.message}}$('search').oninput=render;$('close').onclick=()=>$('modal').classList.remove('show');$('save').onclick=save;req('/products').then(p=>{products=p;render()}).catch(e=>document.body.innerHTML='<div class="wrap red">'+safe(e.message)+'</div>');</script></body></html>
