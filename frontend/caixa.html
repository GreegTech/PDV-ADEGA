<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caixa • Adega ERP</title><style>
:root{--bg:#0d0f12;--panel:#15181d;--line:#2b3139;--text:#f4f6f8;--muted:#9ba6b2;--gold:#d8a23b;--green:#35c47c;--red:#ff7272}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui}.shell{max-width:1200px;margin:auto;padding:28px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.wide{grid-column:1/-1}.field{width:100%;margin:8px 0;background:#0f1216;border:1px solid var(--line);color:white;border-radius:9px;padding:11px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--gold);font-weight:800;cursor:pointer}.secondary{background:#252b33;color:white}.danger{background:#3a2023;color:#ff9a9a}.muted{color:var(--muted)}.value{font-size:28px;font-weight:900}.green{color:var(--green)}.red{color:var(--red)}.hidden{display:none!important}.message{padding:12px;border-radius:9px;margin:12px 0;background:#18271f;color:#79e1a6}.message.error{background:#321c20;color:#ff9a9a}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}@media(max-width:800px){.grid{grid-template-columns:1fr}.top,.row{align-items:flex-start;flex-direction:column}.shell{padding:16px}table{display:block;overflow:auto}}
</style></head><body><main class="shell"><header class="top"><div><h1>Caixa</h1><div id="identity" class="muted">Carregando...</div></div><a class="btn secondary" href="/">Voltar ao PDV</a></header><div id="message"></div>
<section id="closed" class="card hidden"><h2>Abrir caixa</h2><select id="register" class="field"></select><input id="opening" class="field" type="number" min="0" step="0.01" value="0" placeholder="Fundo inicial"><button id="open" class="btn">Abrir caixa</button></section>
<section id="opened" class="grid hidden"><article class="card"><div class="muted">Fundo inicial</div><div id="openingValue" class="value">R$ 0,00</div></article><article class="card"><div class="muted">Dinheiro esperado</div><div id="expectedValue" class="value green">R$ 0,00</div></article><article class="card"><div class="muted">Sessão</div><div id="sessionValue" class="value">—</div></article>
<article id="adjustCard" class="card"><h2>Suprimento / Sangria</h2><select id="movementType" class="field"><option value="SUPPLY">Suprimento</option><option value="WITHDRAWAL">Sangria</option></select><input id="movementAmount" class="field" type="number" min="0.01" step="0.01" placeholder="Valor"><input id="movementNotes" class="field" placeholder="Observação"><button id="move" class="btn">Registrar</button></article>
<article class="card"><h2>Fechar caixa</h2><input id="closing" class="field" type="number" min="0" step="0.01" placeholder="Dinheiro contado"><button id="close" class="btn danger">Fechar caixa</button></article>
<article class="card"><h2>Vendas por pagamento</h2><div id="payments"></div></article></section>
<section class="card wide" style="margin-top:14px"><h2>Histórico</h2><table><thead><tr><th>Sessão</th><th>Abertura</th><th>Fechamento</th><th>Esperado</th><th>Diferença</th><th>Status</th></tr></thead><tbody id="history"></tbody></table></section></main>
<script>
const API=`http://${location.hostname}:8000`,token=localStorage.getItem('at_token');const $=id=>document.getElementById(id),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me,current;
function logout(){localStorage.removeItem('at_token');location.href='/'}async function request(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};if(opt.body)opt.headers['Content-Type']='application/json';const r=await fetch(API+path,opt);let d={};try{d=await r.json()}catch{}if(r.status===401){logout();throw Error('Sessão expirada')}if(!r.ok)throw Error(d.detail||'Erro na API');return d}function notify(text,error=false){$('message').innerHTML=`<div class="message ${error?'error':''}">${safe(text)}</div>`}
function render(){const store=me.context.stores.find(s=>s.id===me.context.selected_store_id);$('identity').textContent=`${me.context.company.name} • ${store?.name||''} • ${me.user.full_name||me.user.username}`;$('closed').classList.toggle('hidden',!!current);$('opened').classList.toggle('hidden',!current);if(!current)return;$('openingValue').textContent=money(current.opening_amount);$('expectedValue').textContent=money(current.expected_cash);$('sessionValue').textContent='#'+current.id;$('payments').innerHTML=Object.entries(current.sales_by_payment||{}).map(([k,v])=>`<div class="row"><span>${safe(k)}</span><b>${money(v)}</b></div>`).join('')||'<span class="muted">Sem vendas.</span>';$('adjustCard').classList.toggle('hidden',!me.context.permissions.includes('cash.adjust'))}
async function load(){if(!token)return logout();me=await request('/auth/me');const[registers,session,history]=await Promise.all([request('/cash/registers'),request('/cash/current'),request('/cash/sessions')]);current=session;$('register').innerHTML=registers.map(r=>`<option value="${r.id}">${safe(r.name)} • ${safe(r.code)}</option>`).join('');$('history').innerHTML=history.map(s=>`<tr><td>#${s.id}</td><td>${money(s.opening_amount)}</td><td>${s.closing_amount==null?'—':money(s.closing_amount)}</td><td>${money(s.expected_cash)}</td><td class="${Number(s.difference||0)<0?'red':'green'}">${s.difference==null?'—':money(s.difference)}</td><td>${safe(s.status)}</td></tr>`).join('');render()}
$('open').onclick=async()=>{try{await request('/cash/open',{method:'POST',body:JSON.stringify({register_id:+$('register').value,opening_amount:+$('opening').value||0})});notify('Caixa aberto.');await load()}catch(e){notify(e.message,true)}};$('move').onclick=async()=>{try{await request('/cash/movements',{method:'POST',body:JSON.stringify({type:$('movementType').value,amount:+$('movementAmount').value,notes:$('movementNotes').value||null})});notify('Movimento registrado.');await load()}catch(e){notify(e.message,true)}};$('close').onclick=async()=>{try{const r=await request('/cash/close',{method:'POST',body:JSON.stringify({closing_amount:+$('closing').value})});notify(`Caixa fechado. Diferença: ${money(r.difference)}`);await load()}catch(e){notify(e.message,true)}};load().catch(e=>notify(e.message,true));
</script></body></html>
